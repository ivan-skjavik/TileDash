<!doctype html>
<html>

<head>
  <title>TileDash</title>

  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="43200">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="shortcut icon" href="./img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./img/favicon.png">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css">
  <!-- <link rel="stylesheet" href="./css/tiledash.css"> -->

  <!-- Essential external dependencies -->
  <!-- <script type="text/javascript" src="./js/moment.min.js"></script> -->
  
  <!-- Main TypeScript application entry point -->
  <script type="module" src="./src/main.ts"></script>

</head>
  <body>
    <div id="flowContainerMobile"></div>
    
    <div id="navPage" class="navigation"></div>
    
    <div id="mainGrid" class="dashboard-main-grid">
      <header id="dashboardHeader" class="dashboard-header">
        <div id="headerPrimary" class="header-primary">
          <div id="customText" class="header-custom-text" style="display: none;"></div>
          <div id="headerValue" class="header-value" style="display: none;"></div>
        </div>
        
        <div id="flowContainer" class="header-flow-container"></div>
        
        <div id="headerSecondary" class="header-secondary" style="display: none;">
          <div class="time-date-container">
            <div id="currentTime" class="current-time"></div>
            <div id="currentDate" class="current-date"></div>
          </div>
        </div>
      </header>

      <div id="dashboardContainer" class="dashboard-container"></div>
    </div>

    <div id="screenSaver"> 
      <img src="" alt="Screen Saver Image" id="screenSaverImage">
    </div>
    
    <div id="overlay" class="overlay"></div>
  </body>
</html>
